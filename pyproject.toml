[project]
name = "diskgoup"
version = "0.1.0"
description = "Cross-platform disk space analyzer and duplicate file finder."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "DiskGOup contributors" }]
keywords = ["disk", "storage", "analyzer", "duplicates", "treemap", "cleanup"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "psutil>=6.0.0",
    "platformdirs>=4.3.0",
    "send2trash>=1.8.3",
    "watchdog>=4.0.0",
    "jinja2>=3.1.4",
]

[project.urls]
Homepage = "https://github.com/elshadaghazade/diskgoup-alternative"
Repository = "https://github.com/elshadaghazade/diskgoup-alternative"

[project.scripts]
diskgoup = "diskgoup.cli:run"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pyinstaller>=6.10.0",
    "types-psutil>=6.0.0",
    "types-Send2Trash>=1.8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diskgoup"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ANN"]
ignore = ["ANN401", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["diskgoup"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: long-running tests"]
