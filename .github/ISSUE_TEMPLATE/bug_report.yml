name: Bug report
description: Something does not work — a command, a scan, or the desktop app.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    value: |
      Thanks for taking the time to report this.

      The most useful bug reports contain the exact command and its output —
      those are usually fixed in a day.

  - type: dropdown
    id: component
    attributes:
      label: Which part of DiskGOup?
      options:
        - The CLI
        - The desktop app
        - The documentation site
        - The build or the releases
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.1 / Ubuntu 24.04 / Windows 11
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: DiskGOup version
      description: The output of `diskgoup --version`.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: The exact command
      description: The command line you ran, copied as it is.
      placeholder: diskgoup scan ~/Downloads
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the full error message — do not shorten it.
      render: shell
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: A screenshot of the app, or the folder layout that triggered it.
